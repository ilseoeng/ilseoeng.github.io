name: Update HTML Directly
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-html:
    if: startsWith(github.event.release.tag_name, 'tm-v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update download metadata while preserving the guide
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          DOWNLOAD_URL=$(jq -r '.release.assets[] | select(.name == "Tm_setup.msi") | .browser_download_url' "$GITHUB_EVENT_PATH")
          python3 scripts/update-download.py --tag "$RELEASE_TAG" --url "$DOWNLOAD_URL" --published-at "$PUBLISHED_AT"
          python3 -m unittest discover -s tests -v

      - name: Commit and Push
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          git add start.html
          
          # 변경사항 확인
          if git diff --staged --quiet; then
            echo "변경사항이 없습니다. (이미 최신 상태이거나 파일이 변경되지 않음)"
          else
            git commit -m "Auto-update start.html to $RELEASE_TAG"
            
            # [중요] 원격 브랜치(main)의 최신 내용을 가져와서 충돌 방지
            git pull --rebase --autostash origin main
            
            # 변경 내용을 main 브랜치로 강제 푸시
            git push origin HEAD:main
          fi
