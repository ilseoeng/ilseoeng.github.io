<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 870" role="img" aria-labelledby="title"><title id="title">Android 홈에서 원격주소와 사용자 정보를 펼친 설정 화면. 123 abc와 상담팀은 입력 예시입니다.</title><g font-family="Noto Sans KR, Malgun Gothic, sans-serif"><rect x="0" y="0" width="400" height="870" rx="0" fill="#f8f9fc"/><rect x="0" y="0" width="400" height="26" rx="0" fill="#4831c9"/><text x="20" y="18" font-size="10" fill="#fff" font-weight="600">9:41</text><text x="334" y="18" font-size="10" fill="#fff" font-weight="400">▰  100</text><rect x="0" y="26" width="400" height="62" rx="0" fill="#6663f4"/><text x="22" y="65" font-size="23" fill="#fff" font-weight="700">홈</text><text x="313" y="62" font-size="12" fill="#e8e8ff" font-weight="600">연결방법</text><rect x="18" y="106" width="364" height="194" rx="18" fill="#6865f4"/><text x="40" y="144" font-size="19" fill="#c4ff9a" font-weight="700">서비스 상태: 대기</text><rect x="39" y="165" width="322" height="36" rx="10" fill="#8380f6"/><text x="50" y="188" font-size="12" fill="#fff" font-weight="600">현재 폴더: 내부 저장소/Recordings/Call</text><rect x="39" y="218" width="154" height="54" rx="12" fill="#fff"/><text x="67" y="251" font-size="15" fill="#6562ec" font-weight="700">서비스 시작</text><rect x="205" y="218" width="154" height="54" rx="12" fill="#fff"/><text x="226" y="251" font-size="14" fill="#6562ec" font-weight="700">녹음 폴더 선택</text><rect x="18" y="316" width="364" height="450" rx="18" fill="#fff"/><text x="38" y="358" font-size="22" fill="#24364b" font-weight="400">⌄</text><text x="69" y="357" font-size="18" fill="#24364b" font-weight="700">원격주소 (필수입력)</text><path d="M37 380H362" stroke="#dce3ec"/><text x="39" y="410" font-size="12" fill="#75839c" font-weight="400">연결 정보 설정</text><rect x="308" y="391" width="51" height="31" rx="8" fill="#6865f4"/><text x="320" y="412" font-size="12" fill="#fff" font-weight="700">저장</text><rect x="39" y="439" width="322" height="76" rx="6" fill="#eeeaf5"/><text x="51" y="462" font-size="12" fill="#24364b" font-weight="400">원격주소 (예: vbn 123)</text><text x="51" y="494" font-size="17" fill="#24364b" font-weight="400">123 abc</text><path d="M39 514H361" stroke="#a3a0ab"/><rect x="39" y="532" width="322" height="76" rx="6" fill="#eeeaf5"/><text x="51" y="555" font-size="12" fill="#24364b" font-weight="400">비밀번호</text><text x="51" y="587" font-size="15" fill="#24364b" font-weight="400">●●●●●●●●</text><path d="M39 607H361" stroke="#a3a0ab"/><text x="38" y="648" font-size="22" fill="#24364b" font-weight="400">⌄</text><text x="69" y="647" font-size="18" fill="#24364b" font-weight="700">사용자 정보 (필수입력)</text><path d="M37 666H362" stroke="#dce3ec"/><text x="44" y="697" font-size="12" fill="#75839c" font-weight="400">이름 (또는 닉네임)</text><text x="44" y="732" font-size="17" fill="#24364b" font-weight="400">상담팀</text><rect x="307" y="705" width="52" height="31" rx="8" fill="#6865f4"/><text x="319" y="726" font-size="12" fill="#fff" font-weight="700">저장</text><rect x="0" y="786" width="400" height="62" rx="0" fill="#fff"/><text x="91" y="811" font-size="27" fill="#4125a5" font-weight="400">⌂</text><text x="95" y="837" font-size="12" fill="#24364b" font-weight="700">홈</text><text x="289" y="811" font-size="25" fill="#4125a5" font-weight="400">☎</text><text x="290" y="837" font-size="12" fill="#24364b" font-weight="400">통화</text><rect x="85" y="843" width="31" height="3" rx="0" fill="#6865f4"/><rect x="163" y="858" width="74" height="4" rx="2" fill="#c4c8cf"/></g></svg>